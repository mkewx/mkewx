name: Fetch FAA Airport Status

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Manual trigger available

permissions:
  contents: write

jobs:
  fetch-flight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p assets/data

      - name: Fetch FAA status for MKE
        run: |
          # Fetch from FAA API (server-side, no CORS issues)
          HTTP_CODE=$(curl -s -o /tmp/faa_response.json -w "%{http_code}" \
            -H "Accept: application/json" \
            "https://soa.smext.faa.gov/asws/api/airport/status/MKE")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            # Add a timestamp to the JSON
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            # Use python to add the fetched_at field
            python3 -c "
          import json, sys
          with open('/tmp/faa_response.json', 'r') as f:
              data = json.load(f)
          data['fetched_at'] = '$TIMESTAMP'
          with open('assets/data/flight.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('FAA data fetched successfully at $TIMESTAMP')
          "
          else
            echo "FAA API returned HTTP $HTTP_CODE"
            # Keep existing file if fetch fails
            if [ ! -f assets/data/flight.json ]; then
              echo '{"Name":"General Mitchell International","Delay":false,"Status":[],"Weather":{},"fetched_at":"unavailable","error":"FAA API unreachable"}' > assets/data/flight.json
            fi
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/data/flight.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update FAA airport status data"
          git push || echo "Nothing to push"

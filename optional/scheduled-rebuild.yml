name: Scheduled GitHub Pages rebuild (MKEWX)

on:
  # Runs daily at 12:15 UTC (~6:15 AM CT standard time; adjust seasonally if you care)
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger rebuild with an empty commit
        run: |
          git config user.name "MKEWX Build Bot"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "chore: scheduled rebuild"
          git push

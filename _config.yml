title: MKEWX
description: "Milwaukee Weather Terminal \u2014 forecast dispatches written as stories."
timezone: America/Chicago
future: false
excerpt_separator: <!--more-->
permalink: /dispatches/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
plugins:
- jekyll-paginate
paginate: 3
paginate_path: /page:num/
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: default
- scope:
    path: ''
    type: posts
  values:
    layout: default

version: 0.5.4

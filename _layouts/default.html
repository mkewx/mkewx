<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#0b120a"/>
  <title>{% if page.title %}{{ page.title }} • {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | escape }}"/>
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ '/feed.xml' | relative_url }}"/>
  <link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}"/>
  <style>
    /* Failsafe minimal styling if CSS fails to load */
    body{background:#050603;color:#ffba5a;}
  </style>
</head>
<body>
  {{ content }}  <script src="{{ '/assets/js/radar.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
<script id="boot-failsafe">
(function(){
  function arm(){
    var boot = document.getElementById("boot");
    if(!boot) return;
    boot.addEventListener("click", function(){ boot.style.display="none"; });
    boot.addEventListener("touchstart", function(){ boot.style.display="none"; }, {passive:true});
    // auto-hide after 8s as a safety net
    setTimeout(function(){ if(boot && boot.style.display!=="none") boot.style.display="none"; }, 8000);
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm);
  else arm();
})();
</script>
</body>
</html>

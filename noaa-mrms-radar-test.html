<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOAA MRMS Radar Test - MKE WX</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      color: #ffb000;
      font-family: 'VT323', monospace;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    h1 {
      color: #ffd700;
      text-align: center;
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #ffa500;
    }
    
    .info {
      text-align: center;
      color: #8b6914;
      margin-bottom: 20px;
      padding: 15px;
      border: 2px solid #8b6914;
      font-size: 16px;
    }
    
    .radar-container {
      position: relative;
      width: 760px;
      height: 760px;
      margin: 0 auto;
      border: 3px solid #ffb000;
      box-shadow: 0 0 20px rgba(255, 176, 0, 0.5);
    }
    
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .controls {
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      border: 2px solid #8b6914;
    }
    
    button {
      background: transparent;
      border: 2px solid #ffb000;
      color: #ffb000;
      padding: 10px 20px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      cursor: pointer;
      margin: 5px;
      transition: all 0.3s ease;
    }
    
    button:hover {
      box-shadow: 0 0 15px rgba(255, 176, 0, 0.5);
    }
    
    .status {
      text-align: center;
      margin-top: 15px;
      color: #ffd700;
      font-size: 18px;
    }
    
    @media (max-width: 800px) {
      .radar-container {
        width: 100%;
        height: 0;
        padding-bottom: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ NOAA MRMS RADAR TEST ⚡</h1>
    
    <div class="info">
      Testing NOAA's Multi-Radar Multi-Sensor (MRMS) data<br>
      Coverage: Sheboygan → Milwaukee → Racine → Kenosha<br>
      Updates every ~5 minutes from NOAA ImageServer
    </div>
    
    <div class="radar-container">
      <canvas id="gridCanvas"></canvas>
      <canvas id="returnsCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <canvas id="sweepCanvas"></canvas>
    </div>
    
    <div class="controls">
      <button onclick="radar.refreshFrame()">REFRESH RADAR</button>
      <button onclick="radar.toggleSweep()">TOGGLE SWEEP</button>
      <div class="status" id="status">Initializing...</div>
    </div>
  </div>
  
  <script>
    const radar = (() => {
      // NOAA MRMS ImageServer endpoint
      const SERVICE = 'https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer';
      const EXPORT = SERVICE + '/exportImage';
      
      // Bounding box: SE Wisconsin coast (less Lake Michigan)
      const BBOX = { 
        xmin: -88.95, 
        ymin: 42.30, 
        xmax: -86.95, 
        ymax: 44.10 
      };
      
      // Cities with lat/lon coordinates
      const CITIES = {
        sheboygan: { lat: 43.7508, lon: -87.7145, name: 'SHEBOYGAN' },
        milwaukee: { lat: 43.0389, lon: -87.9065, name: 'MILWAUKEE' },
        racine: { lat: 42.7261, lon: -87.7829, name: 'RACINE' },
        kenosha: { lat: 42.5847, lon: -87.8212, name: 'KENOSHA' }
      };
      
      // Canvas elements
      let gridCtx, returnsCtx, overlayCtx, sweepCtx;
      let radarImage = null;
      let sweepAngle = 0;
      let sweepActive = true;
      let animationFrame = null;
      
      function init() {
        const gridCanvas = document.getElementById('gridCanvas');
        const returnsCanvas = document.getElementById('returnsCanvas');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const sweepCanvas = document.getElementById('sweepCanvas');
        
        const size = 760;
        [gridCanvas, returnsCanvas, overlayCanvas, sweepCanvas].forEach(c => {
          c.width = size;
          c.height = size;
        });
        
        gridCtx = gridCanvas.getContext('2d');
        returnsCtx = returnsCanvas.getContext('2d');
        overlayCtx = overlayCanvas.getContext('2d');
        sweepCtx = sweepCanvas.getContext('2d');
        
        drawGrid();
        drawOverlay();
        refreshFrame();
        animate();
      }
      
      function bboxToString(b) {
        return [b.xmin, b.ymin, b.xmax, b.ymax].join(',');
      }
      
      function buildExportUrl() {
        const u = new URL(EXPORT);
        u.searchParams.set('f', 'image');
        u.searchParams.set('bbox', bboxToString(BBOX));
        u.searchParams.set('bboxSR', '4326');
        u.searchParams.set('imageSR', '4326');
        u.searchParams.set('size', '760,760');
        u.searchParams.set('format', 'png32');
        u.searchParams.set('_ts', String(Date.now())); // cache buster
        return u.toString();
      }
      
      function updateStatus(msg) {
        document.getElementById('status').textContent = msg;
      }
      
      async function refreshFrame() {
        updateStatus('Fetching radar data from NOAA...');
        try {
          const url = buildExportUrl();
          console.log('Fetching:', url);
          
          const img = new Image();
          img.crossOrigin = 'anonymous';
          
          img.onload = () => {
            radarImage = img;
            updateStatus('Radar data loaded! ' + new Date().toLocaleTimeString());
            console.log('Radar image loaded successfully');
          };
          
          img.onerror = () => {
            updateStatus('ERROR: Failed to load radar image');
            console.error('Failed to load radar image from:', url);
          };
          
          img.src = url;
        } catch (error) {
          updateStatus('ERROR: ' + error.message);
          console.error('Radar fetch error:', error);
        }
      }
      
      function drawGrid() {
        const size = 760;
        const centerX = size / 2;
        const centerY = size / 2;
        const maxRadius = size * 0.45;
        
        gridCtx.fillStyle = '#000000';
        gridCtx.fillRect(0, 0, size, size);
        
        // Range rings
        gridCtx.strokeStyle = 'rgba(139, 105, 20, 0.5)';
        gridCtx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
          gridCtx.beginPath();
          gridCtx.arc(centerX, centerY, maxRadius * (i / 4), 0, Math.PI * 2);
          gridCtx.stroke();
        }
        
        // Crosshairs
        gridCtx.beginPath();
        gridCtx.moveTo(0, centerY);
        gridCtx.lineTo(size, centerY);
        gridCtx.moveTo(centerX, 0);
        gridCtx.lineTo(centerX, size);
        gridCtx.stroke();
      }
      
      function latLonToPixel(lat, lon) {
        const x = ((lon - BBOX.xmin) / (BBOX.xmax - BBOX.xmin)) * 760;
        const y = ((BBOX.ymax - lat) / (BBOX.ymax - BBOX.ymin)) * 760;
        return { x, y };
      }
      
      function drawOverlay() {
        const size = 760;
        
        overlayCtx.clearRect(0, 0, size, size);
        
        // Draw cities
        Object.values(CITIES).forEach(city => {
          const pos = latLonToPixel(city.lat, city.lon);
          
          // City marker glow
          overlayCtx.shadowBlur = 8;
          overlayCtx.shadowColor = '#ffa500';
          overlayCtx.fillStyle = '#ffd700';
          overlayCtx.beginPath();
          overlayCtx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
          overlayCtx.fill();
          overlayCtx.shadowBlur = 0;
          
          // City label
          overlayCtx.fillStyle = '#ffb000';
          overlayCtx.font = '14px VT323';
          overlayCtx.textAlign = 'left';
          overlayCtx.fillText(city.name, pos.x + 8, pos.y + 5);
        });
        
        // Lake Michigan label
        overlayCtx.fillStyle = 'rgba(139, 105, 20, 0.6)';
        overlayCtx.font = '16px VT323';
        overlayCtx.textAlign = 'center';
        overlayCtx.fillText('LAKE MICHIGAN', size * 0.75, size / 2);
      }
      
      function drawAmberWedge(ctx, img, angle, wedgeSize) {
        const size = 760;
        const centerX = size / 2;
        const centerY = size / 2;
        
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle - wedgeSize / 2);
        
        // Create wedge clip path
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, size, 0, wedgeSize);
        ctx.closePath();
        ctx.clip();
        
        ctx.translate(-centerX, -centerY);
        
        // Draw radar image with filter
        ctx.filter = 'grayscale(1) contrast(2.2) brightness(1.05)';
        ctx.drawImage(img, 0, 0, size, size);
        
        // Force amber tint
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = 'rgba(242, 178, 74, 1)'; // amber phosphor
        ctx.fillRect(0, 0, size, size);
        ctx.globalCompositeOperation = 'source-over';
        
        ctx.restore();
      }
      
      function animate() {
        const size = 760;
        const centerX = size / 2;
        const centerY = size / 2;
        
        // Phosphor decay on returns canvas
        returnsCtx.globalAlpha = 0.95;
        returnsCtx.fillStyle = '#000000';
        returnsCtx.fillRect(0, 0, size, size);
        returnsCtx.globalAlpha = 1.0;
        
        // Draw current wedge if we have radar data
        if (radarImage) {
          const wedgeSize = Math.PI / 36; // 5 degrees
          drawAmberWedge(returnsCtx, radarImage, sweepAngle, wedgeSize);
        }
        
        // Clear and draw sweep line
        sweepCtx.clearRect(0, 0, size, size);
        
        if (sweepActive) {
          sweepCtx.save();
          sweepCtx.translate(centerX, centerY);
          sweepCtx.rotate(sweepAngle);
          
          // Sweep gradient
          const gradient = sweepCtx.createLinearGradient(0, 0, size / 2, 0);
          gradient.addColorStop(0, 'rgba(255, 176, 0, 0.3)');
          gradient.addColorStop(0.3, 'rgba(255, 215, 0, 0.6)');
          gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
          
          sweepCtx.fillStyle = gradient;
          sweepCtx.beginPath();
          sweepCtx.moveTo(0, 0);
          sweepCtx.lineTo(size / 2, -8);
          sweepCtx.lineTo(size / 2, 8);
          sweepCtx.closePath();
          sweepCtx.fill();
          
          // Bright sweep line
          sweepCtx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
          sweepCtx.lineWidth = 2;
          sweepCtx.shadowBlur = 10;
          sweepCtx.shadowColor = '#ffa500';
          sweepCtx.beginPath();
          sweepCtx.moveTo(0, 0);
          sweepCtx.lineTo(size / 2, 0);
          sweepCtx.stroke();
          sweepCtx.shadowBlur = 0;
          
          sweepCtx.restore();
          
          sweepAngle += 0.02;
          if (sweepAngle > Math.PI * 2) sweepAngle = 0;
        }
        
        animationFrame = requestAnimationFrame(animate);
      }
      
      function toggleSweep() {
        sweepActive = !sweepActive;
        if (!sweepActive) {
          sweepCtx.clearRect(0, 0, 760, 760);
        }
      }
      
      return {
        init,
        refreshFrame,
        toggleSweep
      };
    })();
    
    // Initialize on load
    window.addEventListener('load', () => {
      radar.init();
    });
  </script>
</body>
</html>
